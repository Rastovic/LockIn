name: tally
description: Screen time you earned.
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.34.3
  # 0.3.x is the first line on sqlite3 3.x, which tally_data already needs.
  drift_flutter: ^0.3.1
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  share_plus: ^12.0.0
  shared_preferences: ^2.3.3
  tally_data: ^0.1.0
  tally_engine: ^0.1.0
  tally_ui: ^0.1.0
  vitals_notify: ^0.1.0
  vitals_archive: ^0.1.0
  vitals_ads: ^0.1.0
  vitals_core: ^0.1.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
